# Harness and provider are stored independently in each meeting.
default_backend = "responses"
default_provider = "openai"
request_timeout_seconds = 120
reasoning_effort = "low"
store_responses = false
codex_dynamic_tools = false

[providers.openai]
name = "openai"
base_url = "https://api.openai.com/v1"
wire_api = "responses"
auth_key = "OPENAI_API_KEY"
model = "gpt-5.6-luna"

[providers.deepseek]
name = "deepseek"
base_url = "https://api.deepseek.com/anthropic"
wire_api = "anthropic"
auth_key = "DEEPSEEK_API_KEY"
model = "deepseek-v4-pro[1m]"
fast_model = "deepseek-v4-flash"

[harnesses.claude-code]
binary = "claude"
restricted = true

[harnesses.trae-acp]
# 同一个 CLI，走 ACP：它自己的只读工具留着，动作还是从我们的 MCP 工具回来。
binary = "traecli"
